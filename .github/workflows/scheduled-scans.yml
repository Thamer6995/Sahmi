name: Sahmi Scheduled Scans

# يستبدل هذا الملف Firebase Scheduled Functions / Cloud Scheduler - تحديدًا
# لأن Cloud Functions تتطلب خطة Blaze، وفوترة Google Cloud الشخصية غير
# متاحة حاليًا في السعودية إلا عبر شريك معتمد (CNTXT) يقبل حسابات Business
# فقط. GitHub Actions يوفّر جدولة (cron) مجانية بديلة تستدعي الخادم
# المستضاف على Render عبر مسارات /internal/* المحمية بسر مشترك.
#
# المتطلبات (Settings > Secrets and variables > Actions):
#   - Variable: RENDER_APP_URL   (مثال: https://sahmi-server.onrender.com)
#   - Secret:   CRON_SECRET      (نفس القيمة المضبوطة في متغيرات بيئة Render)
#
# ملاحظة مهمة: GitHub Actions يشغّل كل خطوة bash بخيار `-e` افتراضيًا، يعني
# أي أمر يفشل (حتى عطل اتصال عابر بـ curl، مثل Render وهو "يستيقظ" من
# الخمول) يوقف السكربت كامل فورًا. لذلك كل استدعاء curl هنا محاط بـ
# `|| response=""` عمدًا حتى لا يوقف عطل اتصال مؤقت الحلقة كاملة - بدل ذلك
# نعامله كرد فارغ ونعيد المحاولة.

on:
  schedule:
    # فحص الأسعار والتنبيهات (12:30 ظهرًا بتوقيت الرياض): مُعطَّل مؤقتًا
    # (2026-07-21) - كان يصطدم يوميًا باستنزاف حصة Firestore (RESOURCE_EXHAUSTED)
    # قبل أن نصل لحل جذري، ما يجعل أي تشخيص/اختبار ليلي مستحيلًا لأن كل
    # كتابة Firestore تنتظر حتى 10 دقائق داخليًا قبل أن تفشل. للتفعيل من
    # جديد: أعد إضافة `- cron: '3,33 * * * *'` هنا، وأزل `if: false` أدناه
    # من job daily-price-and-alert-scan.
    # - cron: '3,33 * * * *'
    # القوائم المالية والنسب: أسبوعيًا - الأحد 00:00 UTC (= 3:00 صباحًا بتوقيت الرياض)
    - cron: '0 0 * * 0'
    # التوزيعات: يوميًا 01:00 UTC (= 4:00 صباحًا بتوقيت الرياض)
    - cron: '0 1 * * *'
  workflow_dispatch: {} # تشغيل يدوي من تبويب Actions لأغراض الاختبار

jobs:
  daily-price-and-alert-scan:
    # مُعطَّل مؤقتًا (2026-07-21) - راجع التعليق أعلاه عند on.schedule لسبب
    # التعطيل وطريقة إعادة التفعيل. حتى workflow_dispatch اليدوي مُعطَّل عمدًا
    # حتى لا يُشغَّل بالخطأ أثناء التشخيص الليلي.
    if: false
    runs-on: ubuntu-latest
    steps:
      # الأسعار (Bulk) سريعة، لكن البيانات التاريخية مقسّمة لدفعات على
      # السيرفر (انظر server/src/scheduled/dailyPriceAndAlertScan.ts) لنفس
      # سبب weekly-financials-scan. نكرر الاستدعاء فقط طالما "active=true"
      # (دورة فعلية شغّالة) - إذا لم يحن وقت الفحص المضبوط بعد، ننجح فورًا
      # دون انتظار (الجدولة نفسها ستستدعينا مرة أخرى خلال 30 دقيقة).
      - name: Trigger daily price + alert scan (loop only while active)
        run: |
          for i in $(seq 1 600); do
            response=$(curl -sS --max-time 120 -X POST "${{ vars.RENDER_APP_URL }}/internal/daily-scan" \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}") || response=""
            echo "$response"
            # استجابة فارغة (فشل curl/انتهاء مهلة، مثلًا Render "يستيقظ" من الخمول)
            # لا تعني أن الدورة انتهت - قد يكون الطلب ما زال يُعالَج فعليًا على
            # الخادم رغم أن curl تخلّى عنه. لا نُنهي النجاح إلا على رد فعلي.
            if [ -z "$response" ]; then
              sleep 5
              continue
            fi
            active=$(echo "$response" | jq -r '.active // false' 2>/dev/null || echo "false")
            if [ "$active" != "true" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "daily-scan لم يكتمل خلال ميزانية إعادة المحاولة." >&2
          exit 1

  weekly-financials-scan:
    if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # المهمة مقسّمة إلى دفعات صغيرة على السيرفر (انظر
      # server/src/scheduled/weeklyFinancialsScan.ts) لأن استدعاء واحدًا
      # يمر على كل شركات السوق دفعة واحدة يتوقف أحيانًا بصمت قبل اكتماله
      # (مؤكَّد فعليًا من سجلات Render). نكرر الاستدعاء هنا حتى ترجع done=true.
      - name: Trigger weekly financials scan (loop until complete)
        run: |
          for i in $(seq 1 600); do
            response=$(curl -sS --max-time 120 -X POST "${{ vars.RENDER_APP_URL }}/internal/weekly-financials" \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}") || response=""
            echo "$response"
            done_flag=$(echo "$response" | jq -r '.done // false' 2>/dev/null || echo "false")
            if [ "$done_flag" = "true" ]; then
              echo "Weekly financials scan cycle completed."
              exit 0
            fi
            sleep 5
          done
          echo "Weekly financials scan did not complete within the retry budget." >&2
          exit 1

  daily-dividends-scan:
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # مقسّم لدفعات على السيرفر (انظر server/src/scheduled/dailyDividendsScan.ts)
      # لنفس سبب weekly-financials-scan أعلاه - نكرر الاستدعاء حتى done=true.
      - name: Trigger daily dividends scan (loop until complete)
        run: |
          for i in $(seq 1 600); do
            response=$(curl -sS --max-time 120 -X POST "${{ vars.RENDER_APP_URL }}/internal/daily-dividends" \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}") || response=""
            echo "$response"
            done_flag=$(echo "$response" | jq -r '.done // false' 2>/dev/null || echo "false")
            if [ "$done_flag" = "true" ]; then
              echo "Daily dividends scan cycle completed."
              exit 0
            fi
            sleep 5
          done
          echo "Daily dividends scan did not complete within the retry budget." >&2
          exit 1
