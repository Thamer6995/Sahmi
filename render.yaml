services:
  - type: web
    name: sahmi-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: SAHMK_API_KEY
        sync: false
      - key: SAHMK_BASE_URL
        value: https://app.sahmk.sa/api/v1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Riyadh
      - key: CRON_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEV_MODE
        value: "false"
